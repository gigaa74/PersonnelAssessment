[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personnel-assessment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=2.3,<3",
    "gunicorn>=23,<24",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "reportlab>=4.2,<5",
    "whitenoise[brotli]>=6.8,<7",
]

[tool.setuptools.packages.find]
include = ["assessment*"]
