databases:
  - name: personnel-assessment-db
    databaseName: personnel_assessment
    user: personnel_assessment

services:
  - type: web
    name: personnel-assessment
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personnel-assessment-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "0"
      - key: APP_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
