<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Оценка персонала{% endblock %}</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --blue:#2457d6; --line:#dce2eb; --bg:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(920px,calc(100% - 32px)); margin:48px auto; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 8px 28px rgba(23,32,51,.06); }
    h1 { margin:0 0 10px; font-size:clamp(26px,4vw,38px); line-height:1.15; }
    h2 { margin:28px 0 12px; }
    .muted { color:var(--muted); }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input,select { width:100%; max-width:520px; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
    button,.button { display:inline-block; border:0; border-radius:10px; padding:12px 18px; background:var(--blue); color:#fff; font-weight:700; text-decoration:none; cursor:pointer; }
    button.secondary { background:#e9eefb; color:var(--ink); }
    .actions { display:flex; gap:10px; justify-content:space-between; margin-top:24px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; background:#fff; }
    th,td { padding:12px; border-bottom:1px solid var(--line); text-align:left; }
    .link { padding:12px; overflow-wrap:anywhere; background:#f7f9fc; border:1px solid var(--line); border-radius:10px; }
    .progress { height:8px; background:#e7ebf2; border-radius:999px; overflow:hidden; margin:18px 0 28px; }
    .progress span { display:block; height:100%; background:var(--blue); }
    ul#id_value { list-style:none; padding:0; max-width:620px; }
    ul#id_value li { margin:10px 0; }
    ul#id_value li label { display:flex; align-items:center; gap:14px; margin:0; padding:14px 16px; border:1px solid var(--line); border-radius:10px; font-weight:500; cursor:pointer; transition:border-color .15s,background .15s; }
    ul#id_value li label:hover { border-color:var(--blue); background:#f7f9ff; }
    ul#id_value input[type="radio"] { appearance:none; -webkit-appearance:none; flex:0 0 24px; width:24px; height:24px; margin:0; padding:0; border:2px solid #8993a4; border-radius:4px; background:#fff; cursor:pointer; }
    ul#id_value input[type="radio"]:checked { border-color:var(--blue); background:var(--blue); box-shadow:inset 0 0 0 5px #fff; }
    ul#id_value input[type="radio"]:focus-visible { outline:3px solid rgba(36,87,214,.25); outline-offset:2px; }
    .errorlist { color:#a22121; }
    .filters { display:grid; grid-template-columns:1fr 220px auto; gap:10px; align-items:end; }
    .filters label { display:none; }
    .score { display:grid; grid-template-columns:minmax(180px,1fr) 3fr 55px; gap:12px; align-items:center; margin:12px 0; }
    .bar { height:12px; background:#e7ebf2; border-radius:999px; overflow:hidden; }.bar span{display:block;height:100%;background:var(--blue)}
    .report-section { padding:20px 0; border-top:1px solid var(--line); }
    .eyebrow { color:var(--blue); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .notice,.warning,.quality-ok { margin:20px 0; padding:16px; border-radius:12px; background:#eef3ff; }
    .warning { background:#fff3e0; border:1px solid #f0c36d; }
    .quality-ok { background:#edf8f1; }
    .table-wrap { overflow-x:auto; }
    .metric { margin:12px 0 20px; }
    .question-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .timer { padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:#f7f9fc; white-space:nowrap; }
    @media(max-width:640px){ main{margin:20px auto}.card{padding:20px} table{font-size:14px}.actions{flex-wrap:wrap}.filters{grid-template-columns:1fr}.score{grid-template-columns:1fr 45px}.score .bar{grid-row:2;grid-column:1/3} }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
